<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breathe Reset — Nervous System Regulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background layers -->
  <div class="bg-mesh"></div>
  <div class="bg-noise"></div>

  <div class="app-shell">

    <!-- ═══════════════════════════════════════
         SIDEBAR
    ═══════════════════════════════════════ -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">◎</span>
        <span class="brand-text">Breathe<br><em>Reset</em></span>
      </div>

      <nav class="exercise-nav">
        <p class="nav-label">Exercises</p>

        <button class="exercise-btn active" data-exercise="478">
          <span class="ex-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </span>
          <span class="ex-info">
            <span class="ex-name">4-7-8</span>
            <span class="ex-desc">Inhale · Hold · Exhale</span>
          </span>
          <span class="ex-tag">4·7·8</span>
        </button>

        <button class="exercise-btn" data-exercise="box">
          <span class="ex-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
            </svg>
          </span>
          <span class="ex-info">
            <span class="ex-name">Box</span>
            <span class="ex-desc">Equal 4-phase cycle</span>
          </span>
          <span class="ex-tag">4·4·4·4</span>
        </button>

        <button class="exercise-btn" data-exercise="calm">
          <span class="ex-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 12h18M12 3c-4.97 5-4.97 13 0 18M12 3c4.97 5 4.97 13 0 18"/>
            </svg>
          </span>
          <span class="ex-info">
            <span class="ex-name">Calm</span>
            <span class="ex-desc">Slow even breath</span>
          </span>
          <span class="ex-tag">5·5</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="session-stats">
          <div class="stat">
            <span class="stat-value" id="cycleCount">0</span>
            <span class="stat-label">Cycles</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-value" id="sessionTime">0:00</span>
            <span class="stat-label">Session</span>
          </div>
        </div>
        <p class="sidebar-tip">Consistent breathing lowers cortisol and activates the parasympathetic nervous system.</p>
      </div>
    </aside>

    <!-- ═══════════════════════════════════════
         MAIN AREA
    ═══════════════════════════════════════ -->
    <main class="main-area">

      <header class="main-header">
        <div class="exercise-title-wrap">
          <h1 class="exercise-title" id="exerciseTitle">4-7-8 Breathing</h1>
          <p class="exercise-subtitle" id="exerciseSubtitle">Activates the parasympathetic nervous system</p>
        </div>
        <div class="rounds-wrap">
          <span class="rounds-label">Round</span>
          <span class="rounds-value" id="roundDisplay">—</span>
        </div>
      </header>

      <!-- Breathing visual arena -->
      <div class="breath-arena">

        <!-- Outer ambient rings -->
        <div class="ring ring-3"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-1"></div>

        <!-- Main breathing circle -->
        <div class="breath-circle-wrap">
          <div class="breath-circle" id="breathCircle">
            <div class="circle-inner">
              <div class="phase-display">
                <span class="phase-name" id="phaseName">Ready</span>
                <span class="phase-timer" id="phaseTimer">—</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Instruction text -->
        <div class="instruction-wrap">
          <p class="instruction-text" id="instructionText">Choose an exercise and press Start</p>
        </div>

        <!-- Progress arc -->
        <svg class="progress-ring" id="progressRing" viewBox="0 0 320 320">
          <circle class="progress-track" cx="160" cy="160" r="148"/>
          <circle class="progress-fill" id="progressFill" cx="160" cy="160" r="148"/>
        </svg>

      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn ctrl-reset" id="resetBtn" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>

        <button class="ctrl-btn ctrl-primary" id="startBtn">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 3l14 9-14 9V3z"/>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
          <span id="startBtnLabel">Start</span>
        </button>

        <button class="ctrl-btn ctrl-skip" id="skipBtn" title="Skip phase">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 4l10 8-10 8V4zM19 5v14"/>
          </svg>
        </button>
      </div>

      <!-- Phase progress dots -->
      <div class="phase-dots" id="phaseDots"></div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
